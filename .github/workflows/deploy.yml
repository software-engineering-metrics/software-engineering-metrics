name: Deploy site

# Publishing happens in a separate repository,
# software-engineering-metrics/software-engineering-metrics.github.io, because
# GitHub Pages will only serve https://software-engineering-metrics.github.io/
# from a repo with exactly that name. This workflow verifies the site still
# builds from this push, then asks that repo to redeploy from it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software-engineering-metrics.github.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: software-engineering-metrics.github.io/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Build site
        run: pnpm run build

  dispatch-deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Push a deploy trigger to software-engineering-metrics.github.io
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:software-engineering-metrics/software-engineering-metrics.github.io.git pages
          cd pages
          printf 'monorepo %s\n' "$GITHUB_SHA" > .deploy-trigger
          git config user.name "monorepo deploy"
          git config user.email "noreply@github.com"
          git add .deploy-trigger
          git commit -m "Deploy monorepo ${GITHUB_SHA::7}"
          git push origin HEAD:main
