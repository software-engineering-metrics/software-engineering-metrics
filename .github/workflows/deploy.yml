name: Deploy site

# Publishing happens in a separate repository,
# software-engineering-metrics/software-engineering-metrics.github.io, because
# GitHub Pages will only serve https://software-engineering-metrics.github.io/
# from a repo with exactly that name. This workflow verifies the site still
# builds from this push, then asks that repo to redeploy from it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software-engineering-metrics.github.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: software-engineering-metrics.github.io/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Build site
        run: pnpm run build

  dispatch-deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Ask software-engineering-metrics.github.io to redeploy
        env:
          GH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
        run: |
          gh api repos/software-engineering-metrics/software-engineering-metrics.github.io/dispatches \
            --method POST \
            --input - <<< '{"event_type":"monorepo-updated","client_payload":{"ref":"main"}}'
