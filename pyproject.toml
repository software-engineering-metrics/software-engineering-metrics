[project]
name = "software-engineering-metrics"
version = "1.0.0"
description = "Software Engineering Metrics: a book about measuring software engineering well."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

# The site (software-engineering-metrics.github.io/) is a separate SvelteKit
# project with its own package.json; there is nothing to package or install
# here beyond the dev tooling below.
[tool.uv]
package = false

# Spell checking (`just spell`, and the PR workflow). The ignore list holds
# false positives only: proper nouns and terms of art the dictionary flags.
[tool.codespell]
skip = "./.venv,./node_modules,./uv.lock,./software-engineering-metrics.github.io/node_modules,./software-engineering-metrics.github.io/build,./software-engineering-metrics.github.io/.svelte-kit,./software-engineering-metrics.github.io/pnpm-lock.yaml,./software-engineering-metrics.github.io/src/content"
ignore-words-list = "synopsys,covert,consequentially,rouge,marz,bloc,wither,sme,erformance,accreting,skelton,fulfilment"

[dependency-groups]
dev = [
    "codespell[toml]>=2.4",
]
