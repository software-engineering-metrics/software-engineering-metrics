packages:
  - '.'

allowBuilds:
  esbuild: true

# @lilydesignsystem/svelte-picker-bar 0.1.0 pins its four picker deps to
# ^0.1.0, which is satisfied by 0.1.1: a real published bug (see each
# package's own CHANGELOG.md, "0.1.2") where headless's newer Listbox/
# IconButton props (baseClass, as, navigation="active-descendant") got
# spread onto the DOM as inert attributes instead of applied, because 0.1.1
# needs svelte-headless ^0.2.0 but still declared ^0.1.0. Force every
# instance (nested under picker-bar too) to the fixed versions.
overrides:
  '@lilydesignsystem/svelte-theme-picker': ^0.1.2
  '@lilydesignsystem/svelte-locale-picker': ^0.1.2
  '@lilydesignsystem/svelte-text-size-picker': ^0.1.2
  '@lilydesignsystem/svelte-share-picker': ^0.1.2
  '@lilydesignsystem/svelte-headless': ^0.2.0
